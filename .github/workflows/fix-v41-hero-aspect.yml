name: Fix V4.1 Hero Aspect
on:
  push:
    branches: [fix-v41-aspect]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hero aspect-ratio fix
        shell: bash
        run: |
          set -euo pipefail
          test -f final-v4.1/styles.css
          test -f final-v4.1/assets/hero-product.webp
          cat >> final-v4.1/styles.css <<'EOF'

/* Hero image integrity: keep source proportions on desktop and mobile */
.hero-product{aspect-ratio:1/1;display:grid;place-items:center;align-self:center}
.hero-product img{width:100%;height:100%;object-fit:contain;object-position:center;transform:scale(1.02)}
@media (max-width:850px){.hero-product{width:min(100%,620px)}}
@media (max-width:560px){.hero-product{width:100%;max-width:100%}.hero-product img{transform:none}}
EOF
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-v41-hero-aspect.yml
          git add -A
          git commit -m 'Fix Onnafit v4.1 hero image proportions'
          git push origin HEAD:fix-v41-aspect
