name: Fix V4.1 Mobile Hero
on:
  push:
    branches: [fix-v41-mobile-hero]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile-only intrinsic aspect fix
        shell: bash
        run: |
          set -euo pipefail
          test -f final-v4.1/styles.css
          printf '%s\n' '' '/* Mobile hero: use intrinsic image ratio to prevent stretching in mobile browsers */' '@media (max-width:560px){' '  .hero-product{aspect-ratio:auto!important;height:auto!important;display:block;width:100%;max-width:100%;}' '  .hero-product img{display:block;width:100%!important;height:auto!important;max-height:none!important;aspect-ratio:auto!important;object-fit:contain!important;object-position:center!important;transform:none!important;}' '}' >> final-v4.1/styles.css
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-v41-mobile-hero.yml
          git add -A
          git commit -m 'Fix Onnafit v4.1 mobile hero image proportions'
          git push origin HEAD:fix-v41-mobile-hero
