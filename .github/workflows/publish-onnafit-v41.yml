name: Publish Onnafit V4.1

on:
  push:
    branches: [publish-v41-mobile]
    paths:
      - 'publish-parts/**'
      - '.github/workflows/publish-onnafit-v41.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build optimized V4.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-v4.1/assets
          cat publish-parts/index/*.txt | base64 -d > final-v4.1/index.html
          cat publish-parts/css/*.txt | base64 -d > final-v4.1/styles.css
          cat publish-parts/js/*.txt | base64 -d > final-v4.1/app.js
          cp final-v3/assets/hero-product.webp final-v4.1/assets/hero-product.webp
          cp final-v3/assets/onnafit-logo.webp final-v4.1/assets/onnafit-logo.webp
          echo '--- integrity ---'
          wc -c final-v4.1/index.html final-v4.1/styles.css final-v4.1/app.js
          sha256sum final-v4.1/index.html final-v4.1/styles.css final-v4.1/app.js
          node --check final-v4.1/app.js
          grep -q 'Onnafit · EMS Body Sculpting' final-v4.1/index.html
          grep -q '5511912228205' final-v4.1/app.js
          grep -q '@media (max-width:560px)' final-v4.1/styles.css
          rm -rf publish-parts
          rm -f .github/workflows/publish-onnafit-v41.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Onnafit v4.1 mobile-optimized'
          git push origin HEAD:publish-v41-mobile
